<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <script src="https://code.jquery.com/jquery-4.0.0.js"></script>
</head>
<body>

username : <input type="text" name="username" class="input_create" id="input_username"/> <br/>
password : <input type="password" name="password" class="input_create"/> <br/>
<button onclick="login_user()">submit</button>
<script>
    function login_user() {

        let _param = {};
        let input_create = $(".input_create");
        for(let each of input_create){
            _param[$(each).attr("name")] = $(each).val();
        }

        $.ajax({
            url: '/api/user/login',
            method: 'POST',
            contentType: 'application/json; charset=utf-8',
            data : JSON.stringify(_param),
            success: function (data, status, xhr) {
                alert("data : " + JSON.stringify(data));
            },
            error: function (data, status, err) {
            },
            complete: function () {
            }
        });
    }
</script>
</body>
</html>
